<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensum Project Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drafting table. Top bar · pannable mind map on plan grid · detail sheet (right on wide screens, bottom on phones). */
:root {
  --bg: #eef1f2; --grid: rgba(28, 46, 58, .07); --surface: #ffffff; --surface-2: #f6f8f8;
  --ink: #1c1c1c; --muted: #58626b; --line: #cdd5da; --accent: #f6740a; --accent-ink: #a94600; --focus: #f6740a;
  --c-site: #d9600a; --c-admin: #2459c7; --c-backend: #0d7a6f; --c-data: #6b46c1; --c-process: #a1610a;
  --c-security: #b42318; --c-ops: #3f6212; --c-quality: #0e6a8a; --c-stack: #4b5563;
  --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 6px 18px rgba(20, 30, 40, .08);
  --display: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101315; --grid: rgba(190, 210, 225, .06); --surface: #191d20; --surface-2: #20252a;
  --ink: #eceff1; --muted: #9aa5ae; --line: #303840; --accent: #ff8a2a; --accent-ink: #ffa25c; --focus: #ffa25c;
  --c-site: #ff9a4d; --c-admin: #7ea6ff; --c-backend: #4fd1c0; --c-data: #b79cff; --c-process: #f2b34a;
  --c-security: #ff8a80; --c-ops: #a3d65c; --c-quality: #5cc8ef; --c-stack: #b6bec7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #101315; --grid: rgba(190, 210, 225, .06); --surface: #191d20; --surface-2: #20252a;
  --ink: #eceff1; --muted: #9aa5ae; --line: #303840; --accent: #ff8a2a; --accent-ink: #ffa25c; --focus: #ffa25c;
  --c-site: #ff9a4d; --c-admin: #7ea6ff; --c-backend: #4fd1c0; --c-data: #b79cff; --c-process: #f2b34a;
  --c-security: #ff8a80; --c-ops: #a3d65c; --c-quality: #5cc8ef; --c-stack: #b6bec7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35); color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .7rem 16px; padding-top: calc(.7rem + env(safe-area-inset-top, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #1c1c1c; font: 600 15px/1 var(--display); }
.brand h1 { margin: 0; font: 600 1.15rem/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand small { display: block; font: 400 .74rem/1.2 var(--body); color: var(--muted); letter-spacing: .01em; text-transform: none; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; }
.search input { width: 100%; height: 38px; padding: 0 .8rem 0 2.1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: inherit; }
.search svg { position: absolute; left: .65rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: .3rem; max-height: 60vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .5rem .6rem; border-radius: 8px; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--surface-2); }
.results b { font-weight: 600; }
.results span { display: block; font-size: .78rem; color: var(--muted); }
.results .none { padding: .6rem; color: var(--muted); font-size: .9rem; }
.tools { display: flex; gap: .4rem; flex-wrap: wrap; margin-left: auto; }
.tool { height: 36px; padding: 0 .75rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; font-size: .88rem; font-weight: 500; }
.tool:hover { border-color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tool svg { width: 16px; height: 16px; }

.main { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; }
@media (min-width: 900px) { .main { grid-template-columns: minmax(0, 1fr) 390px; } }

.viewport { position: relative; overflow: hidden; touch-action: none; cursor: grab; min-height: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; }
.viewport.dragging { cursor: grabbing; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.stage.animate { transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
.edges { position: absolute; left: 0; top: 0; overflow: visible; }
.edges path { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .55; }
.node { position: absolute; width: max-content; display: flex; align-items: stretch; transition: left .4s cubic-bezier(.2, .7, .2, 1), top .4s cubic-bezier(.2, .7, .2, 1), opacity .3s; }
.node[hidden] { display: none !important; }
.node .pick { border: 1.5px solid var(--cc); background: var(--surface); border-radius: 12px; padding: .5rem .75rem; text-align: left; cursor: pointer; max-width: 230px; box-shadow: var(--shadow); line-height: 1.25; }
.node .pick strong { display: block; font: 500 .9rem/1.25 var(--body); }
.node .pick small { display: block; font-size: .74rem; color: var(--muted); margin-top: .15rem; }
.node.d1 .pick { background: var(--cc); border-color: var(--cc); color: #fff; max-width: 240px; padding: .6rem .9rem; }
.node.d1 .pick strong { font: 600 1rem/1.15 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.node.d1 .pick small { color: rgba(255, 255, 255, .85); }
:root[data-theme="dark"] .node.d1 .pick { color: #111; }
:root[data-theme="dark"] .node.d1 .pick small { color: rgba(0, 0, 0, .7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node.d1 .pick { color: #111; } :root:not([data-theme="light"]) .node.d1 .pick small { color: rgba(0, 0, 0, .7); } }
.node.root .pick { background: var(--ink); color: var(--bg); border: 0; padding: .9rem 1.2rem; max-width: 260px; text-align: center; border-radius: 16px; }
.node.root .pick strong { font: 600 1.25rem/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.node.root .pick small { color: var(--bg); opacity: .75; font-size: .8rem; }
.node .pick:hover { transform: translateY(-1px); }
.node.selected .pick { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--cc); }
.node.match .pick { box-shadow: 0 0 0 3px var(--accent); }
.node.dim { opacity: .35; }
.node .twist { align-self: center; width: 24px; height: 24px; margin: 0 -12px; z-index: 1; border-radius: 50%; border: 1.5px solid var(--cc); background: var(--surface); color: var(--cc); cursor: pointer; display: grid; place-items: center; font: 600 14px/1 var(--body); padding: 0; }
.node.left { flex-direction: row-reverse; }
.node .count { font-size: .68rem; }

.panel { background: var(--surface); border-left: 1px solid var(--line); overflow: auto; min-height: 0; padding: 18px 20px 28px; }
@media (max-width: 899px) {
  .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 52%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .14); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 4; }
  .panel.min { max-height: 64px; overflow: hidden; }
}
.panel-head { display: flex; align-items: flex-start; gap: .5rem; }
.panel-head .grow { flex: 1; min-width: 0; }
.sheet-toggle { display: none; }
@media (max-width: 899px) { .sheet-toggle { display: inline-flex; } }
.crumbs { display: flex; flex-wrap: wrap; gap: .25rem; font-size: .75rem; color: var(--muted); margin-bottom: .35rem; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cc); }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--cc); }
.panel h2 { margin: .25rem 0 .2rem; font: 600 1.45rem/1.15 var(--display); letter-spacing: .02em; text-wrap: balance; }
.panel .sub { margin: 0 0 .8rem; color: var(--muted); }
.panel p { margin: 0 0 .8rem; max-width: 65ch; }
.panel h3 { margin: 1.2rem 0 .5rem; font: 600 .78rem/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: .55rem; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: .6rem; align-items: start; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--cc); color: var(--surface); display: grid; place-items: center; font: 700 .75rem/1 var(--body); margin-top: .05rem; }
.files { margin: 0; padding: 0; list-style: none; display: grid; gap: .3rem; }
.files li { font: 400 .8rem/1.4 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: .3rem .5rem; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tags span { font-size: .78rem; padding: .2rem .55rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem; margin: .4rem 0 .6rem; }
.facts div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: .55rem .65rem; }
.facts b { display: block; font: 600 1.35rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.facts span { font-size: .76rem; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: .4rem; }
.links button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: .35rem .6rem; font-size: .84rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; }
.links button::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc); }
.links button:hover { border-color: var(--muted); }
.legend { display: grid; gap: .35rem; margin-top: .3rem; }
.legend button { display: flex; align-items: center; gap: .55rem; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: .45rem .6rem; cursor: pointer; text-align: left; }
.legend button::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--cc); flex: none; }
.legend small { color: var(--muted); margin-left: auto; font-size: .75rem; }
.howto { font-size: .86rem; color: var(--muted); }
.howto kbd { font: 500 .75rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 .3rem; background: var(--surface-2); }

.outline { overflow: auto; padding: 18px 16px 40px; min-height: 0; }
.outline[hidden] { display: none; }
.outline ul { list-style: none; margin: 0; padding: 0 0 0 1rem; border-left: 1px dashed var(--line); }
.outline > ul { padding-left: 0; border-left: 0; max-width: 900px; margin: 0 auto; }
.outline details { margin: .3rem 0; }
.outline summary { cursor: pointer; padding: .4rem .55rem; border-radius: 9px; list-style: none; display: flex; gap: .5rem; align-items: baseline; }
.outline summary::-webkit-details-marker { display: none; }
.outline summary::before { content: "+"; font: 600 .9rem/1 var(--mono); color: var(--cc); width: 1ch; }
.outline details[open] > summary::before { content: "–"; }
.outline summary:hover { background: var(--surface); }
.outline summary b { font-weight: 600; }
.outline summary span { color: var(--muted); font-size: .85rem; }
.outline .body { padding: .2rem .6rem .6rem 1.6rem; }
.outline .body p { margin: 0 0 .5rem; max-width: 70ch; }

.cat-site { --cc: var(--c-site); } .cat-admin { --cc: var(--c-admin); } .cat-backend { --cc: var(--c-backend); } .cat-data { --cc: var(--c-data); }
.cat-process { --cc: var(--c-process); } .cat-security { --cc: var(--c-security); } .cat-ops { --cc: var(--c-ops); } .cat-quality { --cc: var(--c-quality); }
.cat-stack { --cc: var(--c-stack); } .cat-root { --cc: var(--ink); }
.zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: .35rem; z-index: 3; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 18px/1 var(--body); box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; }
.zoom svg { width: 16px; height: 16px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 600px) {
  .tool .label { display: none; } .brand small { display: none; } .bar { gap: .5rem; }
  .brand { flex: 1; } .tools { margin-left: 0; } .search { order: 3; flex-basis: 100%; max-width: none; }
  .zoom button { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) { .node, .stage.animate { transition: none; } .node .pick:hover { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">S</div><h1>Project map<small>Sensum Construcciones · website + Content Manager</small></h1></div>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search: leads, backups, Tickets.php, cron…" aria-label="Search the map" autocomplete="off" aria-controls="results" aria-expanded="false">
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <div class="tools">
      <button class="tool" id="expand" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Expand all</span></button>
      <button class="tool" id="collapse" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Collapse</span></button>
      <button class="tool" id="outlineBtn" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4h9M5 8h9M5 12h9M2 4h.01M2 8h.01M2 12h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="label">Outline</span></button>
    </div>
  </header>
  <div class="main">
    <div class="viewport" id="viewport" aria-label="Mind map. Drag to move, pinch or Ctrl + scroll to zoom.">
      <div class="stage" id="stage"><svg class="edges" id="edges" width="1" height="1" aria-hidden="true"></svg></div>
      <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="Fit the map to the screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
    <div class="outline" id="outline" hidden></div>
    <aside class="panel" id="panel" aria-live="polite" aria-label="Details"></aside>
  </div>
</div>
<script>
// ------------------------------------------------------------------ the project, as data
const N = (id, t, s, o = {}, kids = []) => ({ id, t, s, ...o, kids });
const CATS = {
  site: 'Public website', admin: 'Admin panel', backend: 'CMS backend', data: 'Data & storage', process: 'Processes',
  security: 'Security', ops: 'Hosting & operations', quality: 'Quality & tests', stack: 'Tech stack',
};
const TREE = N('root', 'Sensum Construcciones', 'Website + Content Manager', {
  cat: 'root',
  d: 'The approved public website of Sensum Construcciones plus a custom Content Manager at app.sensumconstrucciones.com. The team changes texts, photos and contact details without touching code; the panel also handles leads, statistics, support requests and a monthly report, and keeps the site monitored and backed up. No framework and no build step: it runs on shared hosting (cPanel, Apache, PHP 8.1+, SQLite).',
  facts: [['91', 'API endpoints'], ['21', 'database tables'], ['13', 'migrations'], ['17', 'panel screens'], ['209', 'API tests'], ['207', 'browser test runs']],
}, [
  // ---------------------------------------------------------------- website
  N('site', 'Public website', 'What visitors see', { cat: 'site', side: 1,
    d: 'Static pages generated by the Content Manager from templates and the saved content. A page view never touches the database, so the site stays fast and keeps working even if the panel is down.',
    files: ['index.html', '404.html', 'privacy-notice.html', 'assets/', 'cms/templates/*.html.tpl'], rel: ['p-publish'] }, [
    N('site-pages', 'Pages & sections', 'One-page site + 404 + privacy', {
      d: 'index.html is one long page: hero, Nosotros, Servicios, Proceso, Tipos de proyectos, Proyectos (cards with a “Ver detalles” photo gallery), call to action, Contacto, Preguntas frecuentes and footer. Plus a 404 page and the privacy notice, which states the real data-retention period.',
      files: ['cms/templates/index.html.tpl', 'cms/templates/404.html.tpl', 'cms/templates/privacy-notice.html.tpl'], rel: ['p-publish', 'be-content'] }),
    N('site-i18n', 'Spanish / English', 'Bilingual without reload', {
      d: 'Every text exists in Spanish and English (bilingual fields in the panel). The language button switches instantly and is remembered on the device. English left empty falls back to Spanish.',
      files: ['assets/main.js'], tech: ['data-i18n attributes', 'localStorage'], rel: ['p-translate'] }),
    N('site-js', 'Behaviour', 'main.js', {
      d: 'Mobile menu (focus trap, Escape, backdrop), project gallery modal (arrows, keyboard, focus return), FAQ accordion, reveal animations that respect reduced motion, the language toggle and the contact-form validation that keeps what the visitor typed.',
      files: ['assets/main.js', 'assets/main.css'], tech: ['Vanilla JS', 'CSS'] }),
    N('site-form', 'Contact form', 'Configurable questions + spam protection', {
      d: 'The questions are configured in the panel: name (always), e-mail and/or phone (at least one required), “Servicio de interés”, the message, and up to 15 questions of 9 types (short text, paragraph, e-mail, phone, number, date, drop-down, single choice, checkboxes), each required or optional, in Spanish and English. The handler checks every answer against the saved questions, stores the lead (extra answers included) and then e-mails it. An invisible proof-of-work captcha always runs; Cloudflare Turnstile can be added from the panel.',
      files: ['assets/contact-handler.php', 'cms/src/ContactFormFields.php', 'cms/src/ContactForm.php', 'cms/src/ContactServices.php'], tech: ['Proof-of-work captcha', 'Cloudflare Turnstile (optional)'], rel: ['p-lead'] }),
    N('site-stats', 'Visit statistics', 'stats.js · no cookies', {
      d: 'A tiny script sends one beacon per visit (page, source, device, language) and per contact click (WhatsApp, phone, e-mail, map, portfolio). No cookies, no IP addresses; “Do Not Track” and robots are ignored.',
      files: ['assets/stats.js', 'cms/src/Analytics.php'], rel: ['p-stats'] }),
    N('site-assets', 'Assets & media', 'Fonts, images, PDF', {
      d: 'Self-hosted Oswald and Roboto (no Google requests), responsive photos generated on upload (several widths, WebP + JPEG, srcset), the downloadable PDF portfolio, icons and the Open Graph image.',
      files: ['assets/fonts/', 'assets/uploads/', 'assets/portfolio/', 'assets/projects/'], tech: ['WebP', 'srcset', 'woff2'] }),
    N('site-delivery', 'SEO & delivery', '.htaccess, sitemap', {
      d: 'sitemap.xml, robots.txt, web manifest and Open Graph tags. The root .htaccess forces HTTPS and the canonical domain, sets security headers (CSP, HSTS, frame and MIME protection), caching and compression, and blocks private files.',
      files: ['.htaccess', 'sitemap.xml', 'robots.txt', 'site.webmanifest'], rel: ['sec-web'] }),
  ]),
  // ---------------------------------------------------------------- admin SPA
  N('admin', 'Admin panel', 'app.sensumconstrucciones.com', { cat: 'admin', side: 1,
    d: 'A single-page app written in plain JavaScript modules: no framework, no bundler. It opens at app.sensumconstrucciones.com (a subdomain that shares public_html; .htaccess routes each name). It talks to the PHP API, shows each person only what their access allows, and works on phones, tablets and computers, in Spanish or English, light or dark.',
    files: ['admin/index.html', 'admin/js/', 'admin/css/admin.css', 'admin/icons.svg'] }, [
    N('adm-shell', 'App shell & router', 'app.js', {
      d: 'Hash routes (#/textos, #/reportes…), the menu built from the person’s permissions, the fixed top bar and logo block, the unsaved-changes guard, and the gates that come before the panel: two-step sign-in setup and the first-sign-in welcome (language and appearance).',

})(TREE, null, 'root', 0, 0);
const pathTo = (id) => { const p = []; for (let n = byId.get(id); n; n = parentOf.get(n.id)) p.unshift(n); return p; };

// ------------------------------------------------------------------ helpers

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const viewport = $('#viewport'); const stage = $('#stage'); const edges = $('#edges'); const panel = $('#panel');
const expanded = new Set(['root']);

const view = { x: 0, y: 0, k: 1 };

// ------------------------------------------------------------------ map rendering
const els = new Map();
function nodeEl(n) {
  if (els.has(n.id)) return els.get(n.id);
  const wrap = document.createElement('div');
  wrap.className = `node d${Math.min(n.depth, 2)} cat-${n.cat}${n.depth === 0 ? ' root' : ''}${n.side < 0 ? ' left' : ''}`;
  if (n.depth === 1) wrap.classList.add('d1');
  const pick = document.createElement('button');
  pick.type = 'button'; pick.className = 'pick';
  pick.innerHTML = `<strong>${esc(n.t)}</strong>${n.s ? `<small>${esc(n.s)}</small>` : ''}`;
  pick.addEventListener('click', (e) => { e.stopPropagation(); onPick(n); });
  wrap.append(pick);
  if (n.kids.length && n.depth > 0) {
    const tw = document.createElement('button');
    tw.type = 'button'; tw.className = 'twist';
    tw.addEventListener('click', (e) => { e.stopPropagation(); toggle(n.id); });

  }

    if (tw) { tw.textContent = expanded.has(n.id) ? '−' : String(n.kids.length); tw.setAttribute('aria-label', `${expanded.has(n.id) ? 'Collapse' : 'Expand'} ${n.t} (${n.kids.length})`); tw.setAttribute('aria-expanded', String(expanded.has(n.id))); }

    const widths = (n) => { colW[n.depth] = Math.max(colW[n.depth] || 0, n.w); if (expanded.has(n.id)) n.kids.forEach(widths); };
    branches.forEach(widths);
    const xAt = (d) => { let x = root.w / 2 + GAP_X; for (let i = 1; i < d; i++) x += colW[i] + GAP_X; return x; };
    const size = (n) => { const kids = expanded.has(n.id) ? n.kids : []; const sum = kids.reduce((a, k) => a + size(k), 0) + Math.max(0, kids.length - 1) * GAP_Y; return (n.sh = Math.max(n.h, sum)); };
    const total = branches.reduce((a, b) => a + size(b), 0) + Math.max(0, branches.length - 1) * BRANCH_GAP;
    const place = (n, cy) => {
      n.y = cy; n.ax = side * xAt(n.depth); // inner edge
      n.x = side > 0 ? n.ax : n.ax - n.w;
      if (!expanded.has(n.id)) return;
      const sum = n.kids.reduce((a, k) => a + k.sh, 0) + Math.max(0, n.kids.length - 1) * GAP_Y;
      let ky = cy - sum / 2;
      n.kids.forEach((k) => { place(k, ky + k.sh / 2); ky += k.sh + GAP_Y; });
    };
    let y = -total / 2;
    branches.forEach((b) => { place(b, y + b.sh / 2); y += b.sh + BRANCH_GAP; });
  }
  // Position + edges
  let paths = '';
  vis.forEach((n) => {
    const el = els.get(n.id);
    el.style.left = n.x + 'px'; el.style.top = (n.y - n.h / 2) + 'px';
    const p = parentOf.get(n.id);
    if (!p) return;
    const sx = p.depth === 0 ? n.side * p.w / 2 : (n.side > 0 ? p.x + p.w : p.x);
    const ex = n.side > 0 ? n.x : n.x + n.w;
    const mx = (sx + ex) / 2;
    paths += `<path d="M${sx},${p.y} C${mx},${p.y} ${mx},${n.y} ${ex},${n.y}" stroke="var(--c-${n.cat})"/>`;
  });
  edges.innerHTML = paths;
}

// ------------------------------------------------------------------ pan & zoom
function apply(animate) {
  stage.classList.toggle('animate', !!animate && !reduceMotion);
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}
function visibleArea() {
  const r = viewport.getBoundingClientRect();
  let h = r.height;
  if (window.innerWidth < 900 && !panel.classList.contains('min')) h -= panel.getBoundingClientRect().height;
  return { w: r.width, h: Math.max(120, h) };
}
function fit(animate = true) {
  const vis = visible();
  const minX = Math.min(...vis.map((n) => n.x)), maxX = Math.max(...vis.map((n) => n.x + n.w));
  const minY = Math.min(...vis.map((n) => n.y - n.h / 2)), maxY = Math.max(...vis.map((n) => n.y + n.h / 2));
  const a = visibleArea();
  view.k = Math.max(.25, Math.min(1.1, (a.w - 48) / (maxX - minX), (a.h - 48) / (maxY - minY)));
  view.x = a.w / 2 - ((minX + maxX) / 2) * view.k;
  view.y = a.h / 2 - ((minY + maxY) / 2) * view.k;
  apply(animate);
}
function reveal(n) {
  const a = visibleArea();
  const sx = view.x + n.x * view.k, sy = view.y + (n.y - n.h / 2) * view.k;
  const ex = sx + n.w * view.k, ey = sy + n.h * view.k;
  if (sx > 16 && ex < a.w - 60 && sy > 16 && ey < a.h - 16) return;
  view.x = a.w / 2 - (n.x + n.w / 2) * view.k;
  view.y = a.h / 2 - n.y * view.k;
  apply(true);
}
function focus(n) {
  const group = [n, ...(expanded.has(n.id) ? n.kids : [])];
  const minX = Math.min(...group.map((g) => g.x)), maxX = Math.max(...group.map((g) => g.x + g.w));
  const minY = Math.min(...group.map((g) => g.y - g.h / 2)), maxY = Math.max(...group.map((g) => g.y + g.h / 2));
  const a = visibleArea();
  view.k = Math.max(.4, Math.min(view.k, (a.w - 40) / (maxX - minX), (a.h - 40) / (maxY - minY)));
  view.x = a.w / 2 - ((minX + maxX) / 2) * view.k;
  view.y = a.h / 2 - ((minY + maxY) / 2) * view.k;
  apply(true);
}
function zoomAt(f, cx, cy) {
  const k = Math.max(.25, Math.min(2.2, view.k * f));
  view.x = cx - (cx - view.x) * (k / view.k); view.y = cy - (cy - view.y) * (k / view.k); view.k = k;
  apply(false);
}
const pointers = new Map(); let pinch = null; let moved = false;
viewport.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; }
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); const cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()]; const r = viewport.getBoundingClientRect();
    zoomAt((pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / view.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (pointers.size === 1) {
    view.x += cur.x - prev.x; view.y += cur.y - prev.y; moved = true; apply(false);
  }
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) viewport.classList.remove('dragging'); };
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(false); }
}, { passive: false });
$('#zin').addEventListener('click', () => { const a = visibleArea(); zoomAt(1.2, a.w / 2, a.h / 2); });
$('#zout').addEventListener('click', () => { const a = visibleArea(); zoomAt(1 / 1.2, a.w / 2, a.h / 2); });
$('#zfit').addEventListener('click', () => fit());

// ------------------------------------------------------------------ interaction
function toggle(id, open) {
  const isOpen = expanded.has(id);
  if (open === true || (open === undefined && !isOpen)) expanded.add(id); else expanded.delete(id);
  layout();
  const n = byId.get(id);
  if (expanded.has(id) && n.kids.length) focus(n); else reveal(n);
}
function onPick(n) {
  select(n.id);
  if (n.kids.length && !expanded.has(n.id)) toggle(n.id, true); else reveal(n);
}
function select(id, { center = false } = {}) {
  selected = id;
  pathTo(id).forEach((p) => { if (p.id !== id) expanded.add(p.id); });
  layout();
  renderPanel(byId.get(id));
  if (center) { const n = byId.get(id); const a = visibleArea(); view.k = Math.max(view.k, .9); view.x = a.w / 2 - (n.x + n.w / 2) * view.k; view.y = a.h / 2 - n.y * view.k; apply(true); }
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* sandboxed */ }
  if (!outline.hidden) { const d = outline.querySelector(`[data-id="${id}"]`); if (d) { d.open = true; d.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); } }
}

// ------------------------------------------------------------------ detail panel
function detailHTML(n, compact = false) {
  let h = '';
  if (n.d) h += `<p>${esc(n.d)}</p>`;
  if (n.facts) h += `<div class="facts">${n.facts.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>`;
  if (n.steps) h += `<h3>How it works</h3><ol class="steps">${n.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>`;
  if (n.files) h += `<h3>Key files</h3><ul class="files">${n.files.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>`;
  if (n.tech) h += `<h3>Technology</h3><div class="tags">${n.tech.map((t) => `<span>${esc(t)}</span>`).join('')}</div>`;
  if (!compact && n.kids.length) h += `<h3>Inside</h3><div class="links">${n.kids.map((k) => `<button type="button" class="cat-${k.cat}" data-go="${k.id}">${esc(k.t)}</button>`).join('')}</div>`;
  if (n.rel) h += `<h3>Related</h3><div class="links">${n.rel.map((r) => byId.get(r)).filter(Boolean).map((k) => `<button type="button" class="cat-${k.cat}" data-go="${k.id}">${esc(k.t)}</button>`).join('')}</div>`;
  return h;
}
function renderPanel(n) {
  const crumbs = pathTo(n.id).slice(0, -1).map((p) => `<button type="button" data-go="${p.id}">${esc(p.t)}</button>`).join('<span aria-hidden="true">›</span>');
  let html = `<div class="panel-head"><div class="grow">${crumbs ? `<div class="crumbs">${crumbs}</div>` : ''}
    <span class="chip cat-${n.cat}">${esc(n.cat === 'root' ? 'Overview' : CATS[n.cat])}</span>
    <h2>${esc(n.t)}</h2>${n.s ? `<p class="sub">${esc(n.s)}</p>` : ''}</div>
    <button type="button" class="tool sheet-toggle" id="sheet" aria-label="Show or hide the details">${panel.classList.contains('min') ? '▴' : '▾'}</button></div>`;
  html += detailHTML(n);
  if (n.id === 'root') {
    html += `<h3>Areas</h3><div class="legend">${TREE.kids.map((b) => `<button type="button" class="cat-${b.cat}" data-go="${b.id}">${esc(b.t)}<small>${b.kids.length}</small></button>`).join('')}</div>
      <h3>Using the map</h3><p class="howto">Tap a box to read about it and open what is inside; the round button folds it again. Drag to move, pinch or <kbd>Ctrl</kbd> + scroll to zoom, and use search to jump to any file or topic. “Outline” lists everything as text.</p>`;
  }
  panel.innerHTML = html;
  [...panel.classList].filter((c) => c.startsWith('cat-')).forEach((c) => panel.classList.remove(c));
  panel.classList.add('cat-' + n.cat);
  panel.scrollTop = 0;
  const sheet = $('#sheet');
  if (sheet) sheet.addEventListener('click', () => { panel.classList.toggle('min'); sheet.textContent = panel.classList.contains('min') ? '▴' : '▾'; });
}
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (!go) return;
  e.preventDefault();
  panel.classList.remove('min');
  select(go.getAttribute('data-go'), { center: true });
});

// ------------------------------------------------------------------ search
const q = $('#q'); const results = $('#results');
const haystack = (n) => [n.t, n.s, n.d, ...(n.steps || []), ...(n.files || []), ...(n.tech || [])].join(' ').toLowerCase();
let hits = []; let active = -1;
function runSearch() {
  const term = q.value.trim().toLowerCase();
  els.forEach((el) => el.classList.remove('match'));
  if (term.length < 2) { results.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  hits = [...byId.values()].filter((n) => n.id !== 'root' && haystack(n).includes(term)).slice(0, 12);
  active = -1;
  results.innerHTML = hits.length ? hits.map((n, i) => `<button type="button" role="option" id="hit-${i}" data-hit="${n.id}" aria-selected="false"><b>${esc(n.t)}</b><span>${esc(pathTo(n.id).slice(1, -1).map((p) => p.t).join(' › ') || CATS[n.cat])}</span></button>`).join('') : '<div class="none">Nothing found. Try “leads”, “cron” or a file name.</div>';
  results.hidden = false; q.setAttribute('aria-expanded', 'true');
  hits.forEach((n) => { const el = els.get(n.id); if (el) el.classList.add('match'); });
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', (e) => {
  if (results.hidden || !hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    results.querySelectorAll('[data-hit]').forEach((b, i) => b.setAttribute('aria-selected', String(i === active)));
    q.setAttribute('aria-activedescendant', 'hit-' + active);
  } else if (e.key === 'Enter') { e.preventDefault(); goHit(hits[Math.max(0, active)].id); }
  else if (e.key === 'Escape') { results.hidden = true; }
});
results.addEventListener('click', (e) => { const b = e.target.closest('[data-hit]'); if (b) goHit(b.getAttribute('data-hit')); });
function goHit(id) { results.hidden = true; q.setAttribute('aria-expanded', 'false'); panel.classList.remove('min'); select(id, { center: true }); }
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) results.hidden = true; });

// ------------------------------------------------------------------ toolbar & outline
$('#expand').addEventListener('click', () => { byId.forEach((n) => { if (n.kids.length) expanded.add(n.id); }); layout(); fit(); });
$('#collapse').addEventListener('click', () => { expanded.clear(); expanded.add('root'); layout(); fit(); });
const outline = $('#outline');
function outlineHTML(n) {
  return `<li><details class="cat-${n.cat}" data-id="${n.id}"${n.depth < 1 ? ' open' : ''}><summary><b>${esc(n.t)}</b>${n.s ? `<span>${esc(n.s)}</span>` : ''}</summary>
    <div class="body">${detailHTML(n, true)}${n.kids.length ? `<ul>${n.kids.map(outlineHTML).join('')}</ul>` : ''}</div></details></li>`;
}
$('#outlineBtn').addEventListener('click', (e) => {
  const on = outline.hidden;
  if (on && !outline.firstChild) outline.innerHTML = `<ul>${outlineHTML(TREE)}</ul>`;
  outline.hidden = !on; viewport.hidden = on;
  e.currentTarget.setAttribute('aria-pressed', String(on));
  if (!on) requestAnimationFrame(() => fit(false));
});

// ------------------------------------------------------------------ start
function start() {
  const hash = location.hash.slice(1);
  layout(); fit(false);
  if (hash && byId.has(hash)) select(hash, { center: true }); else renderPanel(TREE);
}
start();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); if (!selected) fit(false); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); if (!selected) fit(false); }, 120); });
</script>
</body>
</html>
