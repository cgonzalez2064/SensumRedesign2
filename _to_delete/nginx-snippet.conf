# Security & performance headers — add inside your server { } block.
# Adjust the domain in ssl_certificate lines and the CSP directives to match
# your real hosting setup before deploying.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Force HTTPS
server {
    listen 80;
    server_name sensumconstrucciones.com www.sensumconstrucciones.com;
    return 301 https://sensumconstrucciones.com$request_uri;
}

# Cache hashed/static assets aggressively
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Gzip / Brotli for text assets (performance)
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 512;
